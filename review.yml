actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    A real Swagger 2.0 definition was harvested verbatim and the apis.yml catalogs
    the documented Pharmacy Unified API product families (3rd-Party Integration,
    Booking Service, Refill Order, Inbox, Communication, Head Office, Pharmacy).
    No WebSocket/SSE surface exists, so no AsyncAPI was authored.
