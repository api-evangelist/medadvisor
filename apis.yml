apis:
- aid: medadvisor:pharmacy-unified-third-party-integration
  name: Pharmacy Unified API - 3rd-Party Integration
  description: >-
    The publicly documented third-party integration surface of MedAdvisor's Pharmacy
    Unified API, enabling external widgets and eCommerce platforms to authenticate,
    look up pharmacy details, retrieve eScript (electronic prescription) status by
    token, and notify a pharmacy of new orders into its PlusOne inbox. Authenticated
    with a JWT bearer token issued from the /3rdpartylogin exchange (clientId +
    clientSecret + Base64-encoded pharmacy credentials).
