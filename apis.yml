aid: medadvisor
url: https://raw.githubusercontent.com/api-evangelist/medadvisor/refs/heads/main/apis.yml
name: MedAdvisor
kind: company
description: >-
  MedAdvisor (MedAdvisor Solutions) is an Australian-founded, ASX-listed medication
  management and patient engagement technology company whose pharmacy workflow software
  runs in more than 95% of Australian community pharmacies and reaches over 4 million
  patients. Its clinician-facing platform - the web-based "MedAdvisor for Pharmacy"
  that replaced the long-running PlusOne desktop software - handles dispense workflow,
  medication adherence, appointment and service booking (vaccinations, health checks,
  scope-of-practice services), e-script (eScript) token handling, refill ordering, and
  omnichannel patient communication, alongside a consumer medication app. On the
  developer side MedAdvisor exposes a real, Swagger-documented HTTP REST surface, the
  Pharmacy Unified API, at pharmacy-unified.api.medadvisor.com.au, including a
  "3rd-Party Integration" family (partner login, pharmacy lookup, eScript status, and
  order notification into the pharmacy PlusOne inbox) for third-party widgets and
  eCommerce integrations. Authentication is a JWT bearer token obtained via a
  clientId/clientSecret plus Base64-encoded pharmacy credentials exchange; the surface
  is HL7/HTTP REST rather than HL7 FHIR - no public FHIR CapabilityStatement or
  SMART-on-FHIR configuration is served. Home market is Australia, positioned as the
  dominant community-pharmacy engagement layer sitting between dispense systems,
  pharmaceutical programs, and patients.
