components:
  schemas:
    MedAdvisor.PharmacyUnifiedAPI.v1.Models.HoUpdatePushDeadlineRequest:
      description: 'Extends or shortens the auto-activation deadline on an already-pushed, still-pending service

        (RAP-38 Story 3a.5, AC1a). Date-only. A past date is allowed — the nightly job picks it up on its

        next run.'
      type: object
      properties:
        autoActivateDate:
          format: date-time
          type: string
    MedAdvisor.PharmacyUnifiedAPI.v1.Models.HoCreateBookingLinkRequest:
      description: 'Payload to generate a deep-link booking token that pre-selects a service (and optionally a pharmacy)

        for the caller''s head office group (RAP-41 Story 1.3). The report group is ALWAYS the caller''s

        reportgroup_id claim — there is intentionally no group id here. The ServiceId /

        PharmacyId are validated server-side against the caller''s own group (AD-7 / authz).'
      type: object
      properties:
        serviceId:
          format: int32
          description: The service to pre-select. Required. Must be in the caller's group catalogue.
          type: integer
        pharmacyId:
          format: int32
          description: 'Optional pharmacy to pre-select alongside the service. When supplied, must be a member of the

            caller''s group. Omit for a service-only deep link.'
          type: integer
    MedAdvisor.PharmacyUnifiedAPI.v1.Models.HoMapCustomServicesRequest:
      description: 'Map selected pharmacy-custom services onto one canonical service (RAP-38 consolidation). Forward-only

        cut-over: each source pharmacy starts offering the target (carrying its real staff/room resources

        over), and the custom is retired. Existing bookings stay on the custom so the pharmacy can still

        complete them; only new bookings use the target. One-way — there is no unmap.'
      type: object
      properties:
        targetServiceId:
          format: int32
          description: The canonical service to map onto — a Default (platform) service or this group's HO service.
          type: integer
        sourceServiceIds:
          description: The pharmacy-custom capability ids to map.
          type: array
          items:
            format: int32
            type: integer
    MedAdvisor.PharmacyUnifiedAPI.v1.Models.HoBulkMappingRequest:
      description: 'Bulk set of head-office-owned identifiers from an uploaded CSV (MAU-10548). The file is parsed in the

        browser, so this is plain JSON: the bulk version of the single-field edits, not a file upload.'
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/MedAdvisor.PharmacyUnifiedAPI.v1.Models.HoBulkMappingEntry'
    MedAdvisor.PharmacyUnifiedAPI.v1.Models.HoBulkCustomFieldEntry:
      description: One custom field cell in a CSV row, by field id (the browser gets ids from the GET).
      type: object
      properties:
        fieldId:
          format: int32
          type: integer
        value:
          type: string
    MedAdvisor.PharmacyUnifiedAPI.v1.Models.HoBulkMappingEntry:
      description: "One CSV row: a pharmacy and the values to store against it. A blank value means \"leave as\n            is\", not \"clear\" — a sparsely filled template must not wipe what the inline edit put there."
      type: object
      properties:
        pharmacyId:
          format: int32
          type: integer
        headOfficeKey:
          type: string
        customFields:
          type: array
          items:
            $ref: '#/components/schemas/MedAdvisor.PharmacyUnifiedAPI.v1.Models.HoBulkCustomFieldEntry'
    MedAdvisor.PharmacyUnifiedAPI.v1.Models.HoUpdatePharmacyIdRequest:
      description: 'Payload to set a pharmacy''s head-office-defined Pharmacy ID (RAP-38). Stored on the pharmacy''s

        membership link (link_Pharmacy_ReportGroup.HeadOfficeKey) — one value per pharmacy + group. Free-form;

        blank/whitespace clears it.'
      type: object
      properties:
        headOfficeKey:
          description: The head office's external reference for the pharmacy. Blank clears it.
          type: string
    MedAdvisor.PharmacyUnifiedAPI.v1.Models.HoUpdateServiceRequest:
      description: "Payload to edit an existing HO-owned service (RAP-38 Story 2.5). Same fields as create. The edit\nupdates the single shared PharmacyCapability, so it applies to every pharmacy currently linked to\nthe service — there is no per-pharmacy copy to re-push.\n            \nDeferred at v1, same as create: the fixed pre-screener (Medicare + DOB), the consent declaration,\nand Category (no storage target yet)."
      type: object
      properties:
        name:
          description: Service name. Required. Stored on PharmacyCapability.Name (max 50 chars).
          type: string
        duration:
          format: int32
          description: Default duration in minutes. Stored in DescriptionElements ("dur").
          type: integer
        fee:
          format: double
          description: Optional fee in dollars. Stored in DescriptionElements ("fee").
          type: number
        description:
          description: Optional website/booking description. Stored in DescriptionElements ("ext" blurb).
          type: string
        formType:
          description: 'Optional PPS program consultation type to attach a form to this service (matches MFP''s Calendar

            Wizard "Form type" field). Null/omitted means no form. Stored in DescriptionElements ("ftype").'
          type: string
    MedAdvisor.PharmacyUnifiedAPI.v1.Models.HoUpdateCustomFieldValueRequest:
      description: 'Payload to set a pharmacy''s value for a generic HO custom field (KORE-254). Free-form; blank/

        whitespace clears it.'
      type: object
      properties:
        value:
          description: The new value for the field. Blank clears it.
          type: string
    MedAdvisor.PharmacyUnifiedAPI.v1.Models.HoPushServiceRequest:
      description: "Push a service to pharmacies in the group (RAP-38 Story 2.7) — the group's own HO service or a\nplatform Default (MAU-10758), never a pharmacy-built custom or another group's service. Targets\nare always resolved within the caller's group. Scope is \"all\", \"states\", or \"pharmacies\".\n            \nMVP behaviour: pushing force-links the service to each target pharmacy with visibility OFF — the\npharmacy has the service but it is not active/bookable until turned on. Pharmacy-side activation\n(notification + opt-in in MFP) is a later piece."
      type: object
      properties:
        scope:
          description: '"all", "states", or "pharmacies".'
          type: string
        states:
          description: State abbreviations (NSW, VIC, …) when Scope = "states".
          type: array
          items:
            type: string
        pharmacyIds:
          description: Pharmacy IDs when Scope = "pharmacies" (intersected with group membership).
          type: array
          items:
            format: int32
            type: integer
        autoActivateDate:
          format: date-time
          description: 'Date the service auto-activates if the pharmacy hasn''t set it up (RAP-38 Story 3a.5). Date-only;

            the nightly job activates it on that date. Optional: null means "no end date" — the service never

            auto-activates and waits for the pharmacy to set it up. When set it must be today or later.'
          type: string
        defaultHoursOption:
          description: 'Which default working-hour template the auto-activation job gives the default "Clinical

            Pharmacist" it creates, if this service auto-activates (MAU-10769). Only meaningful alongside

            {MedAdvisor.PharmacyUnifiedAPI.v1.Models.HoPushServiceRequest.AutoActivateDate} — ignored when it is null, since nothing is ever auto-activated.

            Must be {MedAdvisor.Framework.Preferences.PharmacyCapabilityPreferenceKeys.DefaultHoursOptionMirrorOpeningHours}

            or {MedAdvisor.Framework.Preferences.PharmacyCapabilityPreferenceKeys.DefaultHoursOptionFixedWeekday} when set.'
          type: string
    MedAdvisor.PharmacyUnifiedAPI.v1.Models.HoServiceVisibilityRequest:
      description: 'Head office''s booking-page service selection (RAP-41 Story 1.7, FR7). This is the WHOLE ticked set,

        not a delta: every eligible catalogue service absent from {MedAdvisor.PharmacyUnifiedAPI.v1.Models.HoServiceVisibilityRequest.ServiceIds} is recorded as

        explicitly hidden. That matches the HQ page''s single "Save service updates" button, and it means a

        save always leaves the group in a fully-decided state rather than accumulating partial edits.

        An empty list is legitimate — it hides everything, leaving a booking page with no services.'
      type: object
      properties:
        serviceIds:
          description: Ids of the services to show on the group's public booking page.
          type: array
          items:
            format: int32
            type: integer
    MedAdvisor.PharmacyUnifiedAPI.v1.Models.HoCreateServiceRequest:
      description: "Payload to create a head-office custom service (RAP-38 Story 2.5). The created capability is\nowned by the caller's report group (OwnerReportGroup_ID) and has NO pharmacy links yet — it\nlands in the catalogue as \"Not pushed\" until a separate push creates the link rows.\n            \nDeferred from the wireframe at v1: the fixed pre-screener (Medicare + DOB) and the consent\ndeclaration. Category is also omitted — it has no storage target yet (OQ-02: the category value\nset is unsettled / expected to come from KAMS metadata), so it is not accepted here rather than\ninvent a column or XML element that may conflict with the eventual design."
      type: object
      properties:
        name:
          description: Service name. Required. Stored on PharmacyCapability.Name (max 50 chars).
          type: string
        duration:
          format: int32
          description: Default duration in minutes. Stored in DescriptionElements ("dur").
          type: integer
        fee:
          format: double
          description: Optional fee in dollars. Stored in DescriptionElements ("fee").
          type: number
        description:
          description: Optional website/booking description. Stored in DescriptionElements ("ext" blurb).
          type: string
        formType:
          description: 'Optional PPS program consultation type to attach a form to this service (matches MFP''s Calendar

            Wizard "Form type" field). Null/omitted means no form. Stored in DescriptionElements ("ftype").'
          type: string
