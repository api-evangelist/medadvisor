  /api/v1/inbox/readytocollect:
    post:
      tags:
      - Inbox
      summary: Mark multiple messages as Ready to collect
      operationId: Inbox_ReadyToCollectMessage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedAdvisor.PharmacyUnifiedAPI.v1.Models.InboxResultModel'
            text/json:
              schema:
                $ref: '#/components/schemas/MedAdvisor.PharmacyUnifiedAPI.v1.Models.InboxResultModel'
            application/xml:
